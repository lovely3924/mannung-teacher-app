<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만능 보육도우미</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f0ff;padding:18px;color:#2f2540}
.card{max-width:680px;margin:auto;background:white;padding:22px;border-radius:28px;box-shadow:0 0 16px rgba(0,0,0,.08)}
h1{text-align:center;color:#8b5cf6}
.sub{text-align:center;color:#6b6178;line-height:1.5}
.section{background:#f3e8ff;padding:12px;border-radius:16px;font-weight:bold;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{padding:18px;border-radius:20px;border:2px solid #eee;background:#fbf8ff;text-align:center;font-weight:bold;cursor:pointer}
.menu.active{border-color:#8b5cf6;background:#f1e8ff}
.menu span{display:block;font-size:30px;margin-bottom:6px}
input,textarea,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:14px;border:1px solid #ddd;font-size:15px}
textarea{height:130px}
button{background:#8b5cf6;color:white;border:0;font-weight:bold;font-size:16px;cursor:pointer}
.copy{background:#6d4fd8}
.result{white-space:pre-wrap;background:#f2e6ff;padding:15px;border-radius:16px;margin-top:15px;line-height:1.75}
.small{font-size:13px;color:#777;line-height:1.5}
</style>
</head>

<body>
<div class="card">
<h1>💜 만능 보육도우미</h1>
<p class="sub">보육일지 · 관찰일지 · 발달평가 · 보육운영평가를 쉽고 빠르게 작성해요.</p>

<div class="section">🏠 메인 기록</div>
<div class="grid">
  <div class="menu active" onclick="pick('보육일지',this)"><span>📘</span>보육일지</div>
  <div class="menu" onclick="pick('관찰일지',this)"><span>🔎</span>관찰일지</div>
  <div class="menu" onclick="pick('발달평가',this)"><span>📊</span>발달평가</div>
  <div class="menu" onclick="pick('보육운영평가',this)"><span>🏫</span>보육운영평가</div>
</div>

<div class="section">🧸 보조 기능</div>
<div class="grid">
  <div class="menu" onclick="pick('키즈노트',this)"><span>💌</span>키즈노트</div>
  <div class="menu" onclick="pick('놀이패널',this)"><span>🎨</span>놀이패널</div>
  <div class="menu" onclick="pick('놀이계획',this)"><span>🧸</span>놀이계획</div>
</div>

<div class="section">✍️ 입력하기</div>

<div id="childBox" style="display:none">
<input id="name" placeholder="아이 이름 예: 김한율">
<input id="age" placeholder="나이/반 예: 만 1세, 0세반">
</div>

<input id="topic" placeholder="놀이 주제 예: 우리가족, 감정놀이, 자동차놀이">

<textarea id="play" placeholder="놀이 내용을 적어주세요. 예: 자동차를 가지고 놀다가 교사에게 어어 하며 표현함"></textarea>

<button onclick="make()">작성하기</button>

<div id="result" class="result">작성 결과가 여기에 나와요 ✨</div>

<button class="copy" onclick="copyText()">복사하기</button>
</div>

<script>
let selected="보육일지";

function pick(type,el){
selected=type;
document.querySelectorAll(".menu").forEach(m=>m.classList.remove("active"));
el.classList.add("active");

if(type==="관찰일지"||type==="발달평가"||type==="키즈노트"){
document.getElementById("childBox").style.display="block";
}else{
document.getElementById("childBox").style.display="none";
}
}

function make(){
let name=document.getElementById("name").value||"영아";
let age=document.getElementById("age").value;
let topic=document.getElementById("topic").value||"오늘의 놀이";
let play=document.getElementById("play").value||"놀이 자료에 관심을 보이며 탐색하는 모습";
let result="";

if(selected==="보육일지"){
result=`[보육일지]

오늘의 놀이 흐름
영아들은 ${topic} 놀이에 관심을 보이며 ${play} 모습을 보였다. 놀이 자료를 바라보고 손으로 만져보며 자신의 흥미를 표현하였고, 반복적인 시도를 통해 놀이의 즐거움을 경험하였다.

영아의 관심
영아들은 놀이 자료의 움직임, 색, 모양, 감촉 등에 관심을 보였으며 또래의 놀이를 바라보거나 교사의 말에 반응하며 자연스럽게 상호작용하였다.

배움읽기
이번 놀이를 통해 영아들은 주변 사물과 상황에 관심을 가지고, 시선·몸짓·소리·표정 등 자신만의 방식으로 흥미와 요구를 표현하는 모습을 보였다. 반복해서 탐색하며 놀이에 머무는 과정에서 안정적인 놀이 참여와 탐색의 즐거움이 나타났다.

지원
교사는 영아의 관심이 머무는 지점을 관찰하고, 필요한 자료를 가까이 제공하며 짧고 따뜻한 언어로 반응하였다. 영아가 스스로 선택하고 반복할 수 있도록 충분한 시간을 제공하며 놀이가 자연스럽게 확장되도록 지원하였다.

다음 놀이 계획
다음 놀이에서는 오늘 나타난 관심을 바탕으로 관련 감각 자료와 역할놀이 자료를 함께 제시하여 놀이가 이어질 수 있도록 지원할 예정이다.`;
}

else if(selected==="관찰일지"){
result=`[관찰일지]

대상: ${name}${age ? " / " + age : ""}

${name}는 ${topic} 놀이 중 ${play} 모습을 보였다. 처음에는 놀이 자료를 바라보며 관심을 보였고, 이후 손으로 만지거나 반복해서 시도하며 놀이에 참여하였다.

놀이 과정에서 ${name}는 시선, 표정, 몸짓, 소리 등 자신만의 방식으로 흥미와 요구를 표현하였다. 교사의 부드러운 반응이 이어지자 안정적으로 탐색을 지속하며 놀이에 머무는 모습이 나타났다.

교사는 ${name}의 관심을 따라가며 충분히 탐색할 수 있도록 시간을 제공하고, 놀이가 자연스럽게 확장될 수 있도록 관련 자료와 언어적 상호작용을 지원할 예정이다.`;
}

else if(selected==="발달평가"){
result=`[발달평가]

대상: ${name}${age ? " / " + age : ""}

${name}는 ${topic} 놀이 경험을 통해 주변 사물과 환경에 관심을 가지고 탐색하는 모습을 보인다. ${play} 과정에서 자신의 방식으로 흥미를 표현하고, 반복적인 시도를 통해 놀이의 즐거움을 경험한다.

교사의 언어적 지원과 안정적인 상호작용 속에서 놀이 경험을 확장해 가는 모습이 나타난다. 앞으로도 ${name}가 스스로 선택하고 시도할 수 있는 충분한 시간과 다양한 감각 자료를 제공하여 안정적인 발달을 지원하고자 한다.`;
}

else if(selected==="보육운영평가"){
result=`[보육운영평가]

월/주간 운영평가
${topic} 놀이를 중심으로 영아들이 ${play} 모습을 보이며 놀이에 참여하였다. 영아의 흥미를 반영한 자료 제공을 통해 자발적인 탐색과 반복 놀이가 이루어졌다.

놀이평가
영아들은 자신의 관심에 따라 자료를 선택하고 탐색하며 놀이를 이어갔다. 또래의 놀이를 바라보거나 교사의 반응에 응답하며 자연스럽게 상호작용하는 모습이 나타났다.

환경구성 평가
영아가 쉽게 접근할 수 있는 위치에 놀이 자료를 제공하여 스스로 선택하고 반복할 수 있도록 하였다. 자료의 수와 배치를 조정하며 영아의 흥미가 지속될 수 있도록 환경을 구성하였다.

다음 운영 방향
다음 주에는 오늘 나타난 관심을 바탕으로 관련 자료를 추가 제공하고, 영아의 표현과 상호작용이 확장될 수 있도록 놀이 환경을 조정할 예정이다.`;
}

else if(selected==="키즈노트"){
result=`안녕하세요.

오늘 ${name}는 ${topic} 놀이 속에서 ${play} 모습을 보였어요. 처음에는 놀이 자료를 바라보며 관심을 보이다가 손으로 만져보거나 반복해서 시도하며 놀이에 즐겁게 참여했답니다.

교사가 ${name}의 관심을 따라 “궁금했구나”, “한 번 더 해볼까?” 하고 따뜻하게 반응해 주자 안정적으로 놀이를 이어가는 모습이 보였어요.

가정에서도 오늘 ${name}가 보인 관심을 함께 이야기해 주시면 놀이 경험이 더욱 풍성하게 이어질 것 같습니다.`;
}

else if(selected==="놀이패널"){
result=`[놀이이야기 패널]

📸 사진 장면
${topic} 놀이 중 영아들은 ${play}

👀 영아의 관심
영아들은 익숙한 자료를 바라보며 관심을 보이고, 손으로 만지거나 반복해서 탐색하려는 모습을 보였다.

💬 놀이 흐름
처음에는 조심스럽게 살펴보다가 교사의 반응이 이어지자 놀이에 머무르며 탐색을 이어갔다. 또래의 놀이를 바라보거나 따라 하며 자연스럽게 상호작용하는 모습도 나타났다.

🌱 다음 지원
오늘 보인 관심을 바탕으로 관련 사진, 역할 소품, 감각 자료를 추가 제공하여 놀이가 확장되도록 지원할 예정이다.`;
}

else if(selected==="놀이계획"){
result=`[놀이계획 + 삐삑추천✨]

놀이 주제: ${topic}
오늘 관찰된 관심: ${play}

내일 연계놀이
1. ${topic} 관련 사진 자료를 보며 이야기 나누기
2. 감각 자료를 추가해 만지고 느껴보기
3. 역할놀이 소품으로 경험을 표현해보기
4. 또래와 함께 반복 놀이 이어가기

필요한 교구
- 관련 사진 또는 그림 자료
- 감각 재료
- 바구니, 천, 소품 등 역할놀이 자료
- 영아가 안전하게 만질 수 있는 실물 자료

교사 지원
영아가 보인 관심을 먼저 관찰하고, “이게 궁금했구나”, “또 해보고 싶구나”처럼 짧고 따뜻한 언어로 반응한다. 놀이가 끊기지 않도록 자료를 가까이 제공하고, 영아의 시도와 반복을 충분히 기다려 준다.

동화 추천
- 가족 주제: 가족과 관련된 사진책, 엄마·아빠가 등장하는 생활동화
- 감정 주제: 감정 색깔, 표정, 마음을 다루는 그림책
- 자연물 주제: 산책, 나뭇잎, 꽃, 곤충이 나오는 그림책
- 자동차 주제: 움직임, 빠르기, 길 찾기와 관련된 그림책`;
}

document.getElementById("result").innerText=result;
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("result").innerText);
alert("복사 완료 💜");
}
</script>
</body>
</html>
