<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만능교사</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f0ff;
  color:#2f2540;
  padding:18px;
}
.app{
  max-width:720px;
  margin:auto;
  background:white;
  border-radius:28px;
  padding:22px;
  box-shadow:0 0 16px rgba(0,0,0,.08);
}
h1{
  text-align:center;
  color:#8b5cf6;
  margin-bottom:6px;
}
.sub{
  text-align:center;
  color:#6b6178;
  margin-bottom:20px;
}
.section{
  background:#f3e8ff;
  padding:12px;
  border-radius:16px;
  font-weight:bold;
  margin:16px 0 10px;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.menu{
  border:2px solid #eee;
  background:#fbf8ff;
  border-radius:20px;
  padding:18px 10px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}
.menu.active{
  border-color:#8b5cf6;
  background:#f0e6ff;
}
.menu span{
  display:block;
  font-size:30px;
  margin-bottom:6px;
}
input,textarea,button,select{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0;
  border-radius:14px;
  border:1px solid #ddd;
  font-size:15px;
}
textarea{
  height:150px;
  line-height:1.5;
}
button{
  background:#8b5cf6;
  color:white;
  border:0;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
.copy{
  background:#6d4fd8;
}
.result{
  white-space:pre-wrap;
  background:#f2e6ff;
  padding:16px;
  border-radius:18px;
  margin-top:15px;
  line-height:1.8;
}
.small{
  font-size:13px;
  color:#777;
}
.hidden{
  display:none;
}
.checkline{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}
.checkline input{
  width:auto;
}
</style>
</head>

<body>
<div class="app">
  <h1>💜 만능교사</h1>
  <p class="sub">짧게 적고, 깊게 기록하기</p>

  <div class="section">🏠 메인 기능</div>
  <div class="grid">
    <div class="menu active" onclick="pick('보육일지',this)"><span>📘</span>보육일지</div>
    <div class="menu" onclick="pick('키즈노트',this)"><span>💌</span>키즈노트</div>
    <div class="menu" onclick="pick('관찰평가',this)"><span>🔎</span>관찰평가</div>
    <div class="menu" onclick="pick('보육과정 운영평가',this)"><span>🏫</span>보육과정 운영평가</div>
  </div>

  <div class="section">🧸 보조 기능</div>
  <div class="grid">
    <div class="menu" onclick="pick('부모상담일지',this)"><span>👨‍👩‍👧</span>부모상담일지</div>
    <div class="menu" onclick="pick('적응일지',this)"><span>🌱</span>적응일지</div>
    <div class="menu" onclick="pick('놀이패널',this)"><span>🎨</span>놀이패널</div>
    <div class="menu" onclick="pick('놀이계획',this)"><span>🧸</span>놀이계획 + 삐삑 추천✨</div>
  </div>

  <div class="section">✏️ 입력하기</div>

  <div id="nameBox">
    <input id="name" placeholder="아이 이름 (선택)">
    <p class="small">※ 보육일지는 비우면 반 전체 기록, 입력하면 개인 중심 기록으로 작성돼요.</p>
  </div>

  <input id="topic" placeholder="놀이 주제 예: 봄꽃 놀이, 자동차 놀이, 감정놀이">

  <textarea id="memo" placeholder="오늘 놀이·일상 메모를 짧게 적어주세요.
예) 한율이 울면서 등원함. 자동차 좋아해서 제공하니 울음 줄고 놀이함."></textarea>

  <div id="outdoorBox">
    <label class="checkline">
      <input type="checkbox" id="outdoorCheck" onchange="toggleOutdoor()">
      🌳 바깥놀이 포함하기
    </label>

    <div id="outdoorDetail" class="hidden">
      <select id="outdoorPlace">
        <option>놀이터</option>
        <option>산책</option>
        <option>생태연못</option>
        <option>마당</option>
        <option>직접입력</option>
      </select>
      <input id="outdoorMemo" placeholder="바깥놀이 메모 예: 올챙이를 바라보며 가까이 다가감">
      <label class="checkline">
        <input type="checkbox" id="replaceCheck">
        ☔ 대체놀이로 작성하기
      </label>
    </div>
  </div>

  <button onclick="make()">💜 작성하기</button>

  <div id="result" class="result">작성 결과가 여기에 나와요 ✨</div>

  <button class="copy" onclick="copyText()">복사하기</button>
</div>

<script>
let selected="보육일지";

function pick(type,el){
  selected=type;
  document.querySelectorAll(".menu").forEach(m=>m.classList.remove("active"));
  el.classList.add("active");

  document.getElementById("outdoorBox").style.display =
    type==="보육일지" ? "block" : "none";

  document.getElementById("nameBox").style.display =
    type==="보육과정 운영평가" || type==="놀이패널" || type==="놀이계획" ? "none" : "block";
}

function toggleOutdoor(){
  document.getElementById("outdoorDetail").classList.toggle(
    "hidden",
    !document.getElementById("outdoorCheck").checked
  );
}

function subject(name){
  return name ? name + "는" : "영아들은";
}

function possess(name){
  return name ? name + "의" : "영아들의";
}

function make(){
  let name=document.getElementById("name").value.trim();
  let topic=document.getElementById("topic").value.trim() || "오늘의 놀이";
  let memo=document.getElementById("memo").value.trim() || "놀이 자료에 관심을 보이며 탐색하는 모습";
  let who=subject(name);
  let whose=possess(name);
  let result="";

  if(selected==="보육일지"){
    result=`[보육일지]

1. 놀이가 왜 시작되었는지
${topic}와 관련된 자료와 상황에 관심을 보이며 놀이가 자연스럽게 시작되었다. ${who} ${memo} 모습을 보이며 놀이에 관심을 나타냈다.

2. 놀이 흐름
처음에는 놀이 자료를 바라보거나 손으로 만져보며 탐색을 시작하였고, 점차 반복적으로 시도하며 놀이에 머무르는 모습을 보였다. 놀이가 이어지는 과정에서 주변 친구의 놀이를 살펴보거나 교사의 반응에 따라 다시 놀이에 참여하는 모습도 나타났다.

3. 영아 관찰 + 교사 상호작용
${who} ${memo} 과정에서 시선, 표정, 몸짓, 소리 등 자신만의 방식으로 흥미와 요구를 표현하였다. 교사는 ${whose} 관심이 머무는 지점을 살펴보고 놀이 상황을 짧은 언어로 표현해주며 상호작용하였다.

4. 교사 지원 + 확장
교사는 ${whose} 관심이 이어질 수 있도록 관련 자료를 가까이 제공하고, 반복적으로 탐색할 수 있도록 충분한 시간을 제공하였다. 이를 통해 영아가 안정적으로 놀이에 참여하며 즐겁게 활동을 이어가는 모습을 보였다.

5. 배움읽기 + 지원
${who} 놀이를 통해 주변 사물과 상황에 관심을 가지고 자신의 방식으로 탐색하며 표현하는 경험을 하였다. 이는 영아가 놀이 속에서 의사소통, 사회관계, 자연탐구, 신체 움직임 등 다양한 경험을 통합적으로 이어가는 과정으로 볼 수 있다. 교사는 영아의 자발적인 시도와 반복 탐색이 이어질 수 있도록 자료와 상호작용을 지속적으로 지원하였다.

6. 놀이 지원 계획
다음 놀이에서는 오늘 나타난 관심을 바탕으로 ${topic}와 관련된 자료를 추가 제공하고, 영아가 스스로 선택하고 반복하며 놀이를 확장할 수 있도록 지원할 예정이다.`;

    if(document.getElementById("outdoorCheck").checked){
      let place=document.getElementById("outdoorPlace").value;
      let outdoor=document.getElementById("outdoorMemo").value.trim() || "주변 환경을 살펴보며 관심을 보임";
      let replace=document.getElementById("replaceCheck").checked;

      result+=`

7. ${replace ? "대체놀이" : "바깥놀이"}
${replace ? "바깥놀이가 어려운 상황을 고려하여 실내에서 관련 경험이 이어질 수 있도록 대체놀이를 제공하였다." : place+"에서 바깥놀이가 이루어졌으며, 영아들은 "+outdoor+" 모습을 보였다."}

${replace ? "영아가 바깥에서 경험할 수 있는 자연물과 움직임에 대한 관심을 실내 놀이로 연결하여 관련 자료를 제공하였고, 영아들은 자신의 방식으로 탐색하며 즐겁게 놀이에 참여하는 모습을 보였다." : "교사는 영아가 주변 자연과 환경을 안전하게 탐색할 수 있도록 가까이에서 살피며 언어적 상호작용을 제공하였다."}`;
    }
  }

  else if(selected==="키즈노트"){
    result=`안녕하세요.

오늘 ${name||"우리 아이"}는 ${topic} 놀이 속에서 ${memo} 모습을 보였어요. 처음에는 주변을 살펴보며 관심을 보이다가 점차 놀이 자료를 만져보거나 반복해서 시도하며 즐겁게 참여했답니다.

교사는 아이가 관심을 보이는 순간을 따라가며 따뜻한 말로 반응해주었고, 아이도 편안한 모습으로 놀이를 이어갔어요.

가정에서도 오늘 보인 관심을 함께 이야기해주시면 놀이 경험이 더욱 풍성하게 이어질 것 같습니다.`;
  }

  else if(selected==="관찰평가"){
    result=`[관찰평가]

${name||"영아"}는 ${topic}와 관련된 놀이와 일상 속에서 ${memo} 모습을 반복적으로 보였다. 관심 있는 자료를 바라보거나 손으로 만져보며 자신의 방식으로 탐색하였고, 교사와의 상호작용 속에서 놀이에 다시 참여하는 모습도 나타났다.

이전보다 일과 흐름에 안정적으로 참여하는 시간이 늘어나고 있으며, 자신의 관심과 감정을 표정, 몸짓, 짧은 언어 등으로 표현하려는 모습을 보였다. 앞으로도 아이의 관심이 이어질 수 있도록 반복 경험과 정서적 지원을 제공하고자 한다.`;
  }

  else if(selected==="보육과정 운영평가"){
    result=`[보육과정 운영평가]

${topic}를 중심으로 영아들이 ${memo} 모습을 보이며 놀이에 참여하였다. 영아의 흥미를 반영한 자료 제공을 통해 자발적인 탐색과 반복 놀이가 이루어졌다.

놀이 과정에서 영아들은 자신의 관심에 따라 자료를 선택하고 탐색하였으며, 또래의 놀이를 바라보거나 교사의 반응에 응답하며 자연스럽게 상호작용하는 모습을 보였다.

교사는 영아가 쉽게 접근할 수 있는 위치에 놀이 자료를 제공하고, 자료의 수와 배치를 조정하며 놀이가 이어질 수 있도록 환경을 구성하였다. 다음 운영에서는 오늘 나타난 관심을 바탕으로 관련 자료를 추가 제공하고, 영아의 표현과 상호작용이 확장될 수 있도록 지원할 예정이다.`;
  }

  else if(selected==="부모상담일지"){
    result=`[부모상담일지]

${name||"영아"}는 원에서 ${topic}와 관련하여 ${memo} 모습을 보이고 있다. 관심 있는 자료를 스스로 선택하거나 반복적으로 탐색하려는 모습이 있으며, 교사의 따뜻한 반응이 이어질 때 더욱 편안하게 놀이에 참여한다.

강점으로는 자신의 관심을 다양한 방식으로 표현하려는 모습이 있으며, 또래나 교사와의 상호작용 속에서 놀이 경험을 확장해가는 모습이 있다. 가정에서도 아이가 관심을 보이는 장면을 충분히 기다려주시고 짧은 말로 행동과 감정을 읽어주시면 표현이 더욱 자연스럽게 이어질 수 있다.`;
  }

  else if(selected==="적응일지"){
    result=`[적응일지]

${name||"영아"}는 새로운 환경과 일과 속에서 ${memo} 모습을 보였다. 처음에는 주변을 살피거나 교사 가까이 머무르려는 모습이 있었으나, 익숙한 놀이와 교사의 안정적인 반응이 이어지자 점차 놀이에 참여하는 모습을 보였다.

교사는 아이가 안정감을 느낄 수 있도록 가까이에서 반응해주고, 선호하는 놀이나 익숙한 자료를 제공하여 자연스럽게 일과에 참여할 수 있도록 지원하였다. 이후 아이는 놀이에 머무르며 교실 생활에 조금씩 적응해가는 모습을 보였다.`;
  }

  else if(selected==="놀이패널"){
    result=`[놀이패널]

📸 놀이 장면
${topic} 놀이 중 영아들은 ${memo}

👀 영아의 관심
영아들은 놀이 자료를 바라보고 손으로 만져보며 관심을 표현하였다.

🌱 배움읽기
놀이를 통해 주변 사물과 상황에 관심을 가지고 자신의 방식으로 탐색하며 표현하는 경험을 하였다.

💜 교사 지원
교사는 영아의 관심을 따라가며 자료를 가까이 제공하고 짧은 언어로 반응하며 놀이가 이어질 수 있도록 지원하였다.`;
  }

  else if(selected==="놀이계획"){
    result=`[놀이계획 + 삐삑 추천✨]

놀이 주제: ${topic}
오늘 관찰된 관심: ${memo}

내일 연계놀이
1. ${topic} 관련 사진 자료를 보며 이야기 나누기
2. 감각 자료를 추가해 만지고 느껴보기
3. 역할놀이 소품으로 경험을 표현해보기
4. 또래와 함께 반복 놀이 이어가기

필요한 교구
- 관련 사진 또는 그림 자료
- 감각 재료
- 바구니, 천, 소품 등 역할놀이 자료
- 영아가 안전하게 만질 수 있는 실물 자료

교사 지원
영아가 보인 관심을 먼저 관찰하고 짧고 따뜻한 언어로 반응한다. 놀이가 끊기지 않도록 자료를 가까이 제공하고, 영아의 시도와 반복을 충분히 기다려 준다.`;
  }

  document.getElementById("result").innerText=result;
}

function copyText(){
  navigator.clipboard.writeText(document.getElementById("result").innerText);
  alert("복사 완료 💜");
}

pick("보육일지",document.querySelector(".menu"));
</script>
</body>
</html>
