<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만능 보육도우미</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f7f0ff;padding:18px;color:#2f2540}
.card{max-width:620px;margin:auto;background:white;padding:22px;border-radius:28px;box-shadow:0 0 16px rgba(0,0,0,.08)}
h1{text-align:center;color:#8b5cf6}
.sub{text-align:center;color:#6b6178}
.group{background:#f3e8ff;padding:12px;border-radius:16px;font-weight:bold;margin:12px 0}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:14px;border:1px solid #ddd;font-size:15px}
textarea{height:120px}
button{background:#8b5cf6;color:white;border:0;font-weight:bold;font-size:16px}
.copy{background:#6d4fd8}
.save{background:#22a06b}
.result{white-space:pre-wrap;background:#f2e6ff;padding:15px;border-radius:16px;margin-top:15px;line-height:1.75}
.preview{display:none;margin-top:10px;border-radius:18px;max-width:100%;border:3px solid #f0e5ff}
.small{font-size:13px;color:#777;line-height:1.5}
.favorite{background:#fff7d6;border:1px solid #ffe59a}
</style>
</head>
<body>

<div class="card">
<h1>💜 만능 보육도우미</h1>
<p class="sub">키즈노트 · 보육일지 · 놀이패널 · 삐삑 추천까지 한 번에</p>

<div class="group">기록 종류 선택</div>

<select id="type" onchange="changeType()">
<option>💌 키즈노트</option>
<option>🔎 관찰일지</option>
<option>🗣️ 부모상담</option>
<option>📊 발달평가</option>
<option>📘 보육일지</option>
<option>🌱 배움읽기+지원</option>
<option>🎨 놀이패널</option>
<option>🧸 놀이계획</option>
<option>✨ 삐삑 추천</option>
</select>

<div id="childBox">
<input id="name" placeholder="아이 이름 예: 김한율">
<input id="age" placeholder="나이/반 예: 만 1세, 0세반">
</div>

<input id="topic" placeholder="놀이 주제 예: 우리가족, 감정놀이, 자동차놀이">

<textarea id="play" placeholder="놀이 내용을 적어주세요. 예: 자동차를 가지고 놀다가 교사에게 어어 하며 표현함"></textarea>

<div id="photoBox">
<div class="group">📸 사진 업로드</div>
<input type="file" accept="image/*" id="photo" onchange="previewPhoto(event)">
<img id="preview" class="preview">
<p class="small">사진은 이 기기에서만 미리보기로 보여요. 실제 저장 기능은 다음 단계에서 연결하면 돼요.</p>
</div>

<button onclick="make()">작성하기</button>

<div id="result" class="result">작성 결과가 여기에 나와요 ✨</div>

<button class="copy" onclick="copyText()">복사하기</button>
<button class="save" onclick="saveFavorite()">⭐ 즐겨찾는 문장 저장</button>

<div class="group">⭐ 즐겨찾는 문장 모음</div>
<div id="favorites" class="result favorite">아직 저장된 문장이 없어요.</div>
</div>

<script>
let favorites=[];

function changeType(){
let t=document.getElementById("type").value;
let childBox=document.getElementById("childBox");

if(t.includes("보육일지")||t.includes("배움읽기")||t.includes("놀이패널")||t.includes("놀이계획")||t.includes("삐삑")){
childBox.style.display="none";
}else{
childBox.style.display="block";
}
}

function previewPhoto(event){
let img=document.getElementById("preview");
img.src=URL.createObjectURL(event.target.files[0]);
img.style.display="block";
}

function make(){
let t=document.getElementById("type").value;
let n=document.getElementById("name").value || "영아";
let age=document.getElementById("age").value;
let topic=document.getElementById("topic").value || "오늘의 놀이";
let p=document.getElementById("play").value || "놀이 자료에 관심을 보이며 탐색하는 모습";
let result="";

if(t.includes("키즈노트")){
result=`안녕하세요.

오늘 ${n}는 ${topic} 놀이 속에서 ${p} 모습을 보였어요. 처음에는 놀이 자료를 바라보며 관심을 보이다가 손으로 만져보거나 반복해서 시도하며 놀이에 즐겁게 참여했답니다.

교사가 ${n}의 관심을 따라 “궁금했구나”, “한 번 더 해볼까?” 하고 따뜻하게 반응해 주자 안정적으로 놀이를 이어가는 모습이 보였어요.

가정에서도 오늘 ${n}가 보인 관심을 함께 이야기해 주시면 놀이 경험이 더욱 풍성하게 이어질 것 같습니다.`;
}

else if(t.includes("관찰일지")){
result=`[관찰일지]

대상: ${n}${age ? " / " + age : ""}

${n}는 ${topic} 놀이 중 ${p} 모습을 보였다. 처음에는 놀이 자료를 바라보며 관심을 보였고, 이후 손으로 만지거나 반복해서 시도하며 놀이에 참여하였다.

놀이 과정에서 ${n}는 시선, 표정, 몸짓, 소리 등 자신만의 방식으로 흥미와 요구를 표현하였다. 교사의 부드러운 반응이 이어지자 안정적으로 탐색을 지속하며 놀이에 머무는 모습이 나타났다.

교사는 ${n}의 관심을 따라가며 충분히 탐색할 수 있도록 시간을 제공하고, 놀이가 자연스럽게 확장될 수 있도록 관련 자료와 언어적 상호작용을 지원할 예정이다.`;
}

else if(t.includes("부모상담")){
result=`[부모상담]

${n}는 원에서 ${topic} 놀이를 하며 ${p} 모습을 보이고 있습니다. 관심 있는 자료를 스스로 선택하고 반복해서 탐색하려는 모습이 있으며, 교사의 따뜻한 반응이 이어질 때 더욱 편안하게 놀이를 지속합니다.

또래나 교사와의 상호작용 속에서 자신의 생각이나 요구를 시선, 표정, 몸짓, 소리 등으로 표현하려는 모습도 관찰됩니다.

가정에서도 ${n}가 관심을 보이는 장면을 충분히 기다려 주시고, 짧은 말로 감정과 행동을 읽어주시면 표현이 더욱 자연스럽게 이어질 수 있습니다.`;
}

else if(t.includes("발달평가")){
result=`[발달평가]

${n}는 ${topic} 놀이 경험을 통해 주변 사물과 환경에 관심을 가지고 탐색하는 모습을 보인다. ${p} 과정에서 자신의 방식으로 흥미를 표현하고, 반복적인 시도를 통해 놀이의 즐거움을 경험한다.

교사의 언어적 지원과 안정적인 상호작용 속에서 놀이 경험을 확장해 가는 모습이 나타난다.

앞으로도 ${n}가 스스로 선택하고 시도할 수 있는 충분한 시간과 다양한 감각 자료를 제공하여 안정적인 발달을 지원하고자 한다.`;
}

else if(t.includes("보육일지")){
result=`[보육일지]

영아들은 ${topic} 놀이에 관심을 보이며 ${p} 모습을 보였다. 놀이 자료를 바라보고 손으로 만져보며 자신의 흥미를 표현하였고, 반복적인 시도를 통해 놀이의 즐거움을 경험하였다.

놀이 과정에서 영아들은 또래의 모습을 바라보거나 교사의 말에 반응하며 자연스럽게 상호작용하였다. 교사는 영아의 관심이 머무는 지점을 관찰하고, 필요한 자료를 가까이 제공하며 놀이가 확장될 수 있도록 지원하였다.

다음 놀이에서는 오늘 나타난 관심을 바탕으로 관련 감각 자료와 역할놀이 자료를 함께 제시하여 놀이가 자연스럽게 이어질 수 있도록 지원할 예정이다.`;
}

else if(t.includes("배움읽기")){
result=`[배움읽기]

영아들은 ${topic} 놀이를 통해 주변 사물과 상황에 관심을 보이고, 시선과 몸짓으로 자신의 흥미를 표현하였다. ${p} 모습에서 탐색의 즐거움과 안정적인 놀이 참여가 나타났다.

[지원]

교사는 영아의 관심을 따라가며 충분히 탐색할 수 있도록 기다려 주고, 짧고 따뜻한 언어로 반응하였다. 이후 관련 자료를 추가 제공하여 놀이가 자연스럽게 이어질 수 있도록 지원할 예정이다.`;
}

else if(t.includes("놀이패널")){
result=`[놀이이야기 패널]

📸 사진 장면
${topic} 놀이 중 영아들은 ${p}

👀 영아의 관심
영아들은 익숙한 자료를 바라보며 관심을 보이고, 손으로 만지거나 반복해서 탐색하려는 모습을 보였다.

💬 놀이 흐름
처음에는 조심스럽게 살펴보다가 교사의 반응이 이어지자 놀이에 머무르며 탐색을 이어갔다. 또래의 놀이를 바라보거나 따라 하며 자연스럽게 상호작용하는 모습도 나타났다.

🌱 다음 지원
오늘 보인 관심을 바탕으로 관련 사진, 역할 소품, 감각 자료를 추가 제공하여 놀이가 확장되도록 지원할 예정이다.`;
}

else if(t.includes("놀이계획")){
result=`[놀이계획]

놀이 주제: ${topic}

영아들이 ${p} 모습을 보여 관련 놀이를 이어가고자 한다.

예상 놀이
- ${topic} 관련 감각 자료 탐색하기
- 관련 사진이나 그림 자료 바라보기
- 역할놀이 소품으로 경험 표현하기
- 친구와 함께 반복 놀이 즐기기

교사 지원
영아가 스스로 선택하고 반복할 수 있는 시간을 충분히 마련하며, 교사는 영아의 말, 표정, 몸짓을 관찰하고 필요한 순간에 언어적 반응과 자료 확장을 지원한다.`;
}

else if(t.includes("삐삑")){
result=`[삐삑 추천✨]

오늘 놀이 주제: ${topic}
오늘 관찰된 관심: ${p}

내일 연계놀이
1. ${topic} 관련 사진 자료를 보며 이야기 나누기
2. 감각 자료를 추가해 만지고 느껴보기
3. 역할놀이 소품으로 경험을 표현해보기
4. 또래와 함께 반복 놀이 이어가기

필요한 교구
- 관련 사진 또는 그림 자료
- 감각 재료
- 바구니, 천, 소품 등 역할놀이 자료
- 영아가 안전하게 만질 수 있는 실물 자료

교사 지원
영아가 보인 관심을 먼저 관찰하고, “이게 궁금했구나”, “또 해보고 싶구나”처럼 짧고 따뜻한 언어로 반응한다. 놀이가 끊기지 않도록 자료를 가까이 제공하고, 영아의 시도와 반복을 충분히 기다려 준다.

동화 추천
- 가족 주제: 가족과 관련된 사진책, 엄마·아빠가 등장하는 생활동화
- 감정 주제: 감정 색깔, 표정, 마음을 다루는 그림책
- 자연물 주제: 산책, 나뭇잎, 꽃, 곤충이 나오는 그림책
- 자동차 주제: 움직임, 빠르기, 길 찾기와 관련된 그림책`;
}

document.getElementById("result").innerText=result;
}

function copyText(){
navigator.clipboard.writeText(document.getElementById("result").innerText);
alert("복사 완료 💜");
}

function saveFavorite(){
let text=document.getElementById("result").innerText;
if(!text || text.includes("작성 결과")) return alert("먼저 작성하기를 눌러주세요");
favorites.unshift(text);
document.getElementById("favorites").innerText=favorites.map((x,i)=>`[${i+1}] ${x}`).join("\\n\\n────────\\n\\n");
alert("즐겨찾기 저장 완료 ⭐");
}

changeType();
</script>

</body>
</html>
