<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>만능 보육도우미</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f6efff;
padding:20px;
margin:0;
}

.card{
max-width:580px;
margin:auto;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
text-align:center;
color:#8b5cf6;
}

.group{
background:#f4ebff;
padding:12px;
border-radius:15px;
font-weight:bold;
margin-bottom:15px;
}

input,select,textarea,button{
width:100%;
padding:14px;
margin:8px 0;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;
font-size:15px;
}

textarea{
height:120px;
}

button{
background:#8b5cf6;
color:white;
border:0;
font-weight:bold;
}

#result{
white-space:pre-wrap;
background:#f2e6ff;
padding:15px;
border-radius:15px;
margin-top:15px;
line-height:1.8;
}

</style>
</head>

<body>

<div class="card">

<h1>💜 만능 보육도우미</h1>

<div class="group">
기록 종류 선택
</div>

<select id="type" onchange="changeType()">

<option>💌 키즈노트</option>
<option>🔎 관찰일지</option>
<option>🗣️ 부모상담</option>
<option>📊 발달평가</option>

<option>📘 보육일지</option>
<option>🌱 배움읽기+지원</option>
<option>🎨 놀이패널</option>
<option>🧸 놀이계획</option>

</select>

<div id="childBox">

<input
id="name"
placeholder="아이 이름">

<input
id="age"
placeholder="나이/반">

</div>

<textarea
id="play"
placeholder="놀이 내용을 입력하세요">
</textarea>

<button onclick="make()">
작성하기
</button>

<div id="result">

작성 결과가 여기에 나와요 ✨

</div>

<button onclick="copyText()">

복사하기

</button>

</div>

<script>

function changeType(){

let t=
document.getElementById(
"type"
).value;

if(

t.includes(
"보육일지"
)

||

t.includes(
"배움읽기"
)

||

t.includes(
"놀이패널"
)

||

t.includes(
"놀이계획"
)

){

document.getElementById(
"childBox"
).style.display=
"none";

}

else{

document.getElementById(
"childBox"
).style.display=
"block";

}

}

function make(){

let t=
document.getElementById(
"type"
).value;

let n=
document.getElementById(
"name"
).value
||
"영아";

let p=
document.getElementById(
"play"
).value;

let result="";

if(
t.includes(
"보육일지"
)
){

result=
`[보육일지]

영아들은 ${p} 놀이에 관심을 보이며 반복적으로 탐색하는 모습을 보였다.

교사는 영아의 관심을 따라가며 놀이가 자연스럽게 이어질 수 있도록 상호작용하였다.

다음 놀이에서는 오늘 나타난 관심을 바탕으로 관련 놀이를 확장해 지원할 예정이다.`;

}

else{

result=
`[${t}]

${n}는 ${p} 과정에서 관심을 보이며 놀이를 이어가는 모습이 나타났다.

교사는 ${n}의 관심을 따라가며 적절한 상호작용을 지원하였다.`;

}

document.getElementById(
"result"
).innerText=result;

}

function copyText(){

navigator.clipboard.writeText(

document.getElementById(
"result"
).innerText

);

alert(
"복사 완료 💜"
);

}

changeType();

</script>

</body>
</html>
